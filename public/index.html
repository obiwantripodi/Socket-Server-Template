<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebSocket Control - React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Audiowide&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#f5eedd; --panel:#efe6d3; --muted:#6b7280; --text:#1f2937; --accent:#e74e3c; --accent-dark:#c53030; --edge:#d7ceb9; --shadow:#00000026; }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(120% 80% at 50% -10%, #fffaf0, var(--bg)); color: var(--text); overflow-x: hidden; }
      
      /* Layout full-screen, no bounding box */
      .container { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding: 0; gap: 0; }
      
      /* Header sticky */
      header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: linear-gradient(180deg, #fbf4e4, #efe6d5); border-bottom: 1px solid var(--edge); box-shadow: 0 4px 12px var(--shadow); position: sticky; top: 0; z-index: 100; }
      header h1 { font-family: 'Audiowide', Inter, sans-serif; font-size: 18px; margin: 0; letter-spacing: 1.2px; text-transform: uppercase; color: #4b5563; text-shadow: 0 1px 0 #ffffffb3, 0 -1px 0 #cfc7b4; }
      .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: #9ca3af; box-shadow: 0 0 4px #9ca3af; }
      .dot.connected { background: #16a34a; box-shadow: 0 0 8px #16a34a99; }
      .dot.disconnected { background: #b91c1c; box-shadow: 0 0 8px #b91c1c99; }

      /* Console CRT */
      .messages { padding: 12px 16px; }
      .crt { position: relative; background: #0a0f0a; border: 1px solid #1b2d1b; border-radius: 8px; height: 48px; overflow: hidden; box-shadow: inset 0 0 0 1px #0f190f, 0 6px 20px #00000030; }
      .crt::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: linear-gradient(180deg, #29ff84, rgba(41,255,132,0.0)); opacity: 0.35; }
      .crt .line { position: absolute; inset: 0; display: grid; align-content: center; padding: 0 12px; font-family: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #29ff84; text-shadow: 0 0 6px rgba(41,255,132,0.65), 0 0 14px rgba(41,255,132,0.35); letter-spacing: 0.25px; font-size: 15px; }
      .crt .scan { position: absolute; inset: 0; background: repeating-linear-gradient( to bottom, rgba(0,0,0,0), rgba(0,0,0,0) 2px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px ); mix-blend-mode: multiply; pointer-events: none; opacity: 0.6; }

      /* Controls area - slider + joystick side by side */
      .controls-area { flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px; padding: 20px 16px; }

      /* Slider vertical */
      .slider-vertical { position: relative; height: 52vh; min-height: 360px; max-height: 500px; border-radius: 14px; background: linear-gradient(180deg, #e0dfdc, #c8c7c3); border: 1px solid #bdbcb8; overflow: hidden; touch-action: none; box-shadow: inset 0 -10px 20px #00000014, inset 0 10px 20px #ffffff59; width: 84px; }
      .slider-vertical::before { content: ""; position: absolute; inset: 10px; border-radius: 14px; background: linear-gradient(90deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 30%), linear-gradient(180deg, #d9d3c2, #cfc7b4); box-shadow: inset 0 2px 3px #ffffffa6, inset 0 -8px 16px #00000029, 0 10px 20px #00000024; }
      .slider-vertical .ticks { position: absolute; left: 50%; top: 12px; bottom: 12px; width: 60%; transform: translateX(-50%); opacity: 0.25; background-image: repeating-linear-gradient(to top, #c6bfae 0 1px, transparent 1px 9%); pointer-events: none; mix-blend-mode: multiply; }
      .slider-vertical .fill { position: absolute; left: 10px; right: 10px; bottom: 10px; border-radius: 12px; height: var(--fill, 0%); background: linear-gradient(180deg, #b8c1c7, #8f9aa3); box-shadow: inset 0 1px 2px #ffffff80, inset 0 -8px 14px #00000029; border: 1px solid #b1b8bf; }
      .slider-vertical .thumb { position: absolute; left: 50%; transform: translate(-50%, 50%); width: 84px; height: 30px; border-radius: 10px; background: linear-gradient(180deg, #f7f7f7 0%, #bfc3c7 40%, #8e9499 60%, #e9ecee 100%), repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 6px, rgba(255,255,255,0.08) 6px 10px); border: 1px solid #c8ccd0; box-shadow: inset 0 1px 0 #ffffffcc, inset 0 -2px 6px #00000033, 0 8px 16px #00000035; touch-action: none; }
      .slider-vertical .thumb::after { content: ""; position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.35) 10%, transparent 35%, transparent 65%, rgba(0,0,0,0.12) 85%, transparent 100%); pointer-events: none; }
      .slider-vertical.active::after { content: ""; position: absolute; inset: 10px; border-radius: 14px; background: repeating-linear-gradient( to top, rgba(0,0,0,0.06), rgba(0,0,0,0.06) 2px, transparent 2px, transparent 6px ); mix-blend-mode: multiply; opacity: 0.35; animation: scrollStripes 120ms linear infinite; }
      @keyframes scrollStripes { from { background-position-y: 0; } to { background-position-y: -8px; } }

      /* Joystick stile PS2 */
      .joystick-container { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
      .joystick-base { position: absolute; width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(135deg, #d9d3c2 0%, #cfc7b4 50%, #b8b3a2 100%); box-shadow: inset 0 -8px 20px #00000024, inset 0 8px 16px #ffffff4d, 0 12px 28px #00000035; border: 2px solid #bdbcb8; }
      .joystick-base::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%); }
      .joystick-track { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(180deg, #e8e3d2, #d4ceb9); box-shadow: inset 0 4px 12px #00000029, inset 0 -2px 8px #ffffff66; border: 1px solid #c8c3b2; }
      .joystick-stick { position: absolute; width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #f7f7f7 0%, #bfc3c7 45%, #8e9499 55%, #e9ecee 100%); box-shadow: inset 0 2px 0 #ffffffd9, inset 0 -4px 10px #00000040, 0 10px 20px #00000040; border: 2px solid #c8ccd0; cursor: grab; touch-action: none; transition: box-shadow 0.1s ease; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      .joystick-stick::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), transparent 55%); pointer-events: none; }
      .joystick-stick::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.15) 0deg 30deg, transparent 30deg 60deg); opacity: 0.3; pointer-events: none; }
      .joystick-stick.active { cursor: grabbing; box-shadow: inset 0 2px 0 #ffffffbf, inset 0 -4px 10px #00000050, 0 8px 18px #00000038; }

      /* Buttons */
      .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; }
      .btn-cassette { position: relative; padding: 16px 12px; border-radius: 12px; color: #374151; background: linear-gradient(180deg, #fff8ea, #eee4cf); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 #ffffffcf, inset 0 6px 0 #ffffff66, 0 8px 0 #cfc7b4, 0 12px 18px #00000024; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 0.05s ease, box-shadow 0.15s ease; }
      .btn-cassette::before { content: ""; position: absolute; inset: 0; border-radius: 12px; background: radial-gradient(160% 120% at 50% 0, #ffffff70, transparent 40%); pointer-events: none; }
      .btn-cassette.active { background: linear-gradient(180deg, #f6edda, #e7dcc4); box-shadow: inset 0 1px 0 #ffffffa6, inset 0 -4px 8px #00000033, 0 4px 12px #0000001f; transform: translateY(2px); }
      .btn-cassette:not(.active) { transform: translateY(-2px); }

      /* Input walkman */
      .input-section { padding: 0 16px 16px; }
      .input-walkman { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px; border-radius: 12px; background: linear-gradient(180deg, #fff8ea, #eee4cf); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 #ffffffbf, inset 0 -4px 8px #00000024; }
      .input-walkman input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #1b2d1b; background: #0a0f0a; color: #29ff84; font-family: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.25px; box-shadow: inset 0 0 0 1px #0f190f, 0 0 10px rgba(41,255,132,0.08); outline: none; }
      .input-walkman input::placeholder { color: #1cff7a99; }
      .btn-send { min-width: 86px; }

      /* Responsive */
      @media (max-width: 480px) {
        .controls-area { gap: 16px; }
        .slider-vertical { width: 70px; height: 45vh; min-height: 300px; }
        .slider-vertical .thumb { width: 70px; }
        .joystick-container { width: 150px; height: 150px; }
        .joystick-base { width: 150px; height: 150px; }
        .joystick-track { width: 100px; height: 100px; }
        .joystick-stick { width: 65px; height: 65px; }
        .buttons { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="root"></div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState, useCallback } = React;

      const useHaptics = () => {
        const lastRef = useRef(0);
        const vibrate = (duration = 10) => {
          try { if (navigator?.vibrate) navigator.vibrate(duration); } catch {}
        };
        const light = useCallback(() => {
          const now = Date.now();
          if (now - lastRef.current < 35) return;
          lastRef.current = now;
          vibrate(8);
        }, []);
        const medium = useCallback(() => vibrate(15), []);
        return { light, medium };
      };

      const useSound = () => {
        const ctxRef = useRef(null);
        const ensure = async () => {
          if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          if (ctxRef.current.state === 'suspended') try { await ctxRef.current.resume(); } catch {}
          return ctxRef.current;
        };
        const click = async (freq = 160, ms = 18) => {
          const ctx = await ensure();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'square'; o.frequency.value = freq; g.gain.value = 0.08;
          o.connect(g); g.connect(ctx.destination);
          const now = ctx.currentTime; g.gain.setValueAtTime(0.08, now); g.gain.exponentialRampToValueAtTime(0.0001, now + ms/1000);
          o.start(); o.stop(now + ms/1000);
        };
        const tick = () => click(220, 12);
        const clack = () => click(120, 30);
        return { tick, clack, ensure };
      };

      function useWebSocket(url) {
        const [status, setStatus] = useState('disconnected');
        const [messages, setMessages] = useState([]);
        const wsRef = useRef(null);

        useEffect(() => {
          const ws = new WebSocket(url);
          wsRef.current = ws;
          setStatus('connecting');

          ws.addEventListener('open', () => {
            setStatus('connected');
            setMessages(m => [...m, { type: 'system', text: 'Connesso al server' }]);
          });

          ws.addEventListener('message', (evt) => {
            const data = evt.data;
            if (data === 'ping') {
              ws.send('pong');
              return;
            }
            setMessages(m => [...m, { type: 'other', text: data }]);
          });

          ws.addEventListener('close', () => {
            setStatus('disconnected');
            setMessages(m => [...m, { type: 'system', text: 'Disconnesso' }]);
          });

          ws.addEventListener('error', () => {
            setMessages(m => [...m, { type: 'system', text: 'Errore WebSocket' }]);
          });

          return () => { ws.close(); };
        }, [url]);

        const send = (text) => {
          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(text);
            setMessages(m => [...m, { type: 'self', text }]);
          }
        };

        return { status, messages, send };
      }

      function SliderVertical({ value, onChange, onInteractStart, haptic, sound }) {
        const ref = useRef(null);
        const lastStepRef = useRef(Math.round(value*20));

        const setFromEvent = useCallback((clientY) => {
          const el = ref.current;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          const rel = (rect.bottom - clientY) / rect.height;
          const clamped = Math.min(1, Math.max(0, rel));
          onChange(parseFloat(clamped.toFixed(3)));
        }, [onChange]);

        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const onPointerDown = (e) => { e.preventDefault(); onInteractStart?.(); el.classList.add('active'); el.setPointerCapture?.(e.pointerId); setFromEvent(e.clientY); haptic?.medium?.(); };
          const onPointerMove = (e) => { if (e.buttons !== 1) { el.classList.remove('active'); return; } setFromEvent(e.clientY); haptic?.light?.(); };
          const onPointerUp = () => { el.classList.remove('active'); };
          el.addEventListener('pointerdown', onPointerDown);
          el.addEventListener('pointermove', onPointerMove);
          el.addEventListener('pointerup', onPointerUp);
          return () => {
            el.removeEventListener('pointerdown', onPointerDown);
            el.removeEventListener('pointermove', onPointerMove);
            el.removeEventListener('pointerup', onPointerUp);
          };
        }, [setFromEvent]);

        useEffect(() => {
          const step = Math.round(value * 20);
          if (step !== lastStepRef.current) { lastStepRef.current = step; sound?.tick?.(); }
        }, [value]);

        const fill = `${(value * 100).toFixed(1)}%`;
        const thumbBottom = `calc(${fill} + 10px - 15px)`;

        return (
          <div className="slider-vertical" ref={ref} style={{ '--fill': fill }}>
            <div className="ticks"></div>
            <div className="fill"></div>
            <div className="thumb" style={{ bottom: thumbBottom }}></div>
          </div>
        );
      }

      function Joystick({ analogX, analogY, onChange, haptic, sound }) {
        const stickRef = useRef(null);
        const trackRef = useRef(null);
        const isDraggingRef = useRef(false);

        const updatePosition = useCallback((clientX, clientY) => {
          const track = trackRef.current;
          if (!track) return;
          
          const rect = track.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const radius = rect.width / 2;

          let deltaX = clientX - centerX;
          let deltaY = clientY - centerY;
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

          if (distance > radius) {
            deltaX = (deltaX / distance) * radius;
            deltaY = (deltaY / distance) * radius;
          }

          const x = parseFloat((deltaX / radius).toFixed(3));
          const y = parseFloat((-deltaY / radius).toFixed(3));

          onChange(x, y);
          haptic?.light?.();
        }, [onChange, haptic]);

        useEffect(() => {
          const stick = stickRef.current;
          if (!stick) return;

          const onPointerDown = (e) => {
            e.preventDefault();
            isDraggingRef.current = true;
            stick.classList.add('active');
            stick.setPointerCapture?.(e.pointerId);
            updatePosition(e.clientX, e.clientY);
            haptic?.medium?.();
            sound?.clack?.();
          };

          const onPointerMove = (e) => {
            if (!isDraggingRef.current) return;
            updatePosition(e.clientX, e.clientY);
          };

          const onPointerUp = () => {
            isDraggingRef.current = false;
            stick.classList.remove('active');
            onChange(0, 0);
            sound?.tick?.();
          };

          stick.addEventListener('pointerdown', onPointerDown);
          stick.addEventListener('pointermove', onPointerMove);
          stick.addEventListener('pointerup', onPointerUp);
          stick.addEventListener('pointercancel', onPointerUp);

          return () => {
            stick.removeEventListener('pointerdown', onPointerDown);
            stick.removeEventListener('pointermove', onPointerMove);
            stick.removeEventListener('pointerup', onPointerUp);
            stick.removeEventListener('pointercancel', onPointerUp);
          };
        }, [updatePosition, haptic, sound]);

        const maxOffset = 20;
        const translateX = analogX * maxOffset;
        const translateY = -analogY * maxOffset;

        return (
          <div className="joystick-container">
            <div className="joystick-base"></div>
            <div className="joystick-track" ref={trackRef}></div>
            <div 
              className="joystick-stick" 
              ref={stickRef}
              style={{ transform: `translate(calc(-50% + ${translateX}px), calc(-50% + ${translateY}px))` }}
            ></div>
          </div>
        );
      }

      function formatLastSelf(list) {
        const last = [...list].reverse().find(m => m.type === 'self');
        if (!last) return '—';
        try {
          const obj = JSON.parse(last.text);
          if (obj && typeof obj === 'object') {
            const s = obj.slider1 !== undefined ? Number(obj.slider1).toFixed(3) : '—';
            const b = obj.button !== undefined ? obj.button : '—';
            const ax = obj.analogX !== undefined ? Number(obj.analogX).toFixed(2) : '0';
            const ay = obj.analogY !== undefined ? Number(obj.analogY).toFixed(2) : '0';
            return `S:${s} B:${b} X:${ax} Y:${ay}`;
          }
        } catch {}
        return String(last.text);
      }

      function App() {
        const haptics = useHaptics();
        const sound = useSound();
        const [host, setHost] = useState(window.location.hostname || 'localhost');
        const [devPort, setDevPort] = useState('443');
        const [path, setPath] = useState('');
        const [input, setInput] = useState('');
        const [slider1, setSlider1] = useState(0.0);
        const [analogX, setAnalogX] = useState(0.0);
        const [analogY, setAnalogY] = useState(0.0);
        const [button, setButton] = useState(null);
        const [sliderInteracted, setSliderInteracted] = useState(false);
        const [sentOk, setSentOk] = useState(false);
        const prevSliderRef = useRef(slider1);
        const prevAnalogRef = useRef({ x: 0, y: 0 });

        const wsUrl = useMemo(() => {
          const isProd = window.location.protocol === 'https:' || window.location.port !== '3000';
          if (!isProd) return `ws://${host}:${devPort}${path ? '/' + path : ''}`;
          return `wss://${host}${path ? '/' + path : ''}`;
        }, [host, devPort, path]);

        const { status, messages, send } = useWebSocket(wsUrl);

        const sendAll = useCallback((sVal, bVal, txt, ax, ay) => {
          try { 
            send(JSON.stringify({ 
              slider1: sVal, 
              button: bVal, 
              text: txt || '', 
              analogX: ax, 
              analogY: ay 
            })); 
          } catch {}
        }, [send]);

        useEffect(() => {
          if (!sliderInteracted) return;
          const prev = prevSliderRef.current;
          if (Math.abs(prev - slider1) >= 0.001) {
            sendAll(slider1, button, input, analogX, analogY);
            prevSliderRef.current = slider1;
          }
        }, [slider1, sliderInteracted, button, sendAll, analogX, analogY, input]);

        useEffect(() => {
          const prev = prevAnalogRef.current;
          if (Math.abs(prev.x - analogX) >= 0.01 || Math.abs(prev.y - analogY) >= 0.01) {
            sendAll(slider1, button, input, analogX, analogY);
            prevAnalogRef.current = { x: analogX, y: analogY };
          }
        }, [analogX, analogY, slider1, button, input, sendAll]);

        useEffect(() => {
          if (button !== 3) return;
          const id = setTimeout(() => { sendAll(slider1, 3, input, analogX, analogY); }, 200);
          return () => clearTimeout(id);
        }, [input, button, slider1, analogX, analogY, sendAll]);

        const handleJoystickChange = useCallback((x, y) => {
          setAnalogX(x);
          setAnalogY(y);
        }, []);

        const dotClass = 'dot ' + (status === 'connected' ? 'connected' : 'disconnected');

        useEffect(() => {
          const onFirstTouch = () => { sound.ensure?.(); document.removeEventListener('touchstart', onFirstTouch); };
          document.addEventListener('touchstart', onFirstTouch, { once: true });
          return () => document.removeEventListener('touchstart', onFirstTouch);
        }, []);

        return (
          <>
            <header>
              <div className="status">
                <span className={dotClass}></span>
              </div>
              <h1>Scenario Control</h1>
            </header>

            <div className="messages">
              <div className="crt">
                <div className="line">{sentOk ? 'OK' : formatLastSelf(messages)}</div>
                <div className="scan"></div>
              </div>
            </div>

            <div className="controls-area">
              <SliderVertical 
                value={slider1} 
                onChange={setSlider1} 
                onInteractStart={() => setSliderInteracted(true)} 
                haptic={haptics} 
                sound={sound} 
              />
              <Joystick 
                analogX={analogX} 
                analogY={analogY} 
                onChange={handleJoystickChange}
                haptic={haptics}
                sound={sound}
              />
            </div>

            <div className="buttons">
              <button aria-label="Button 0" className={`btn-cassette ${button===0?'active':''}`} onClick={() => { setButton(0); sendAll(slider1, 0, input, analogX, analogY); haptics.medium(); sound.clack(); }}></button>
              <button aria-label="Button 1" className={`btn-cassette ${button===1?'active':''}`} onClick={() => { setButton(1); sendAll(slider1, 1, input, analogX, analogY); haptics.medium(); sound.clack(); }}></button>
              <button aria-label="Button 2" className={`btn-cassette ${button===2?'active':''}`} onClick={() => { setButton(2); sendAll(slider1, 2, input, analogX, analogY); haptics.medium(); sound.clack(); }}></button>
              <button aria-label="Custom Text" className={`btn-cassette ${button===3?'active':''}`} onClick={() => { setButton(3); sendAll(slider1, 3, input, analogX, analogY); haptics.medium(); sound.clack(); }}></button>
            </div>

            {button === 3 && (
              <div className="input-section">
                <div className="input-walkman">
                  <input placeholder="Scrivi un messaggio..." value={input} onChange={e => setInput(e.target.value)} />
                  <button className="btn-cassette btn-send" onClick={() => { sendAll(slider1, 3, input, analogX, analogY); sound.clack(); setSentOk(true); setTimeout(()=>setSentOk(false), 1000); }}>Invia</button>
                </div>
              </div>
            )}
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
