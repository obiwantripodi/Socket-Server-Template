<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Control - React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#0f172a; --panel:#111827; --muted:#94a3b8; --text:#e5e7eb; --accent:#22c55e; --danger:#ef4444; }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(80% 100% at 50% 0%, #0a0f23, #0b1022 40%, #0f172a); color: var(--text); }
      .container { max-width: 900px; margin: 0 auto; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
      .card { background: linear-gradient(180deg, rgba(10,15,35,0.9), rgba(15,23,42,0.85)); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 20px 40px rgba(0,0,0,0.35); overflow: hidden; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(148,163,184,0.12); position: sticky; top: 0; background: linear-gradient(180deg, rgba(17,24,39,0.85), rgba(17,24,39,0.6)); backdrop-filter: blur(10px); z-index: 2; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
      header h1 { font-size: 18px; margin: 0; }
      .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: gray; box-shadow: 0 0 10px currentColor; }
      .dot.connected { background: var(--accent); }
      .dot.disconnected { background: var(--danger); }
      .content { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
      @media (max-width: 800px) { .content { grid-template-columns: 1fr; } }
      .messages { background: linear-gradient(180deg, rgba(2,6,23,0.45), rgba(2,6,23,0.25)); border: 1px solid rgba(148,163,184,0.14); border-radius: 14px; min-height: 160px; max-height: 40vh; overflow: auto; padding: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
      .msg { padding: 10px 12px; margin: 8px 0; border-radius: 10px; line-height: 1.35; border: 1px solid rgba(148,163,184,0.12); }
      .msg.self { background: rgba(34,197,94,0.1); }
      .msg.other { background: rgba(59,130,246,0.08); }
      .msg.system { background: rgba(148,163,184,0.10); color: var(--muted); font-size: 13px; }
      .sidebar { background: rgba(2,6,23,0.35); border: 1px solid rgba(148,163,184,0.12); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; }
      .row { display: grid; gap: 8px; }
      label { font-size: 12px; color: var(--muted); }
      input, button, select { font: inherit; }
      input, select { width: 100%; padding: 10px 12px; background: #0b1220; color: var(--text); border: 1px solid rgba(148,163,184,0.2); border-radius: 8px; outline: none; }
      input:focus, select:focus { border-color: rgba(34,197,94,0.7); box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
      .actions { display: flex; gap: 8px; }
      button { padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.25); background: #0b1220; color: var(--text); cursor: pointer; transition: transform 0.05s ease; }
      button.primary { background: linear-gradient(135deg, #22c55e, #16a34a); border: none; }
      button:active { transform: translateY(1px); }
      footer { padding: 12px 16px; border-top: 1px solid rgba(148,163,184,0.12); display: flex; gap: 8px; }
      footer input { flex: 1; }

      /* Sliders layout */
      .sliders { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; }
      @media (max-width: 480px) { .sliders { grid-template-columns: 1fr; gap: 12px; } }
      .slider-card { position: relative; background: linear-gradient(180deg, rgba(2,6,23,0.5), rgba(2,6,23,0.3)); border: 1px solid rgba(148,163,184,0.14); border-radius: 18px; padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 18px 40px rgba(0,0,0,0.3); }
      .slider-title { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
      .slider-value { font-weight: 600; color: var(--text); }
      .slider-vertical { position: relative; height: 52vh; min-height: 360px; border-radius: 18px; background: radial-gradient(100% 120% at 50% 100%, rgba(11,18,32,0.95), rgba(11,18,32,0.85)); border: 1px solid rgba(148,163,184,0.18); overflow: hidden; touch-action: none; box-shadow: inset 0 -10px 20px rgba(0,0,0,0.35), inset 0 10px 20px rgba(255,255,255,0.02); }
      /* iridescent liquid fill */
      .slider-vertical .liquid { position: absolute; left: 0; right: 0; bottom: 0; height: var(--fill, 0%); background: conic-gradient(from 180deg at 50% 100%, rgba(56,189,248,0.95), rgba(99,102,241,0.95), rgba(236,72,153,0.95), rgba(34,197,94,0.95), rgba(56,189,248,0.95)); filter: saturate(140%) brightness(1.06); }
      .slider-vertical .sheen { position: absolute; inset: 0; background: radial-gradient(120% 50% at 50% 100%, rgba(255,255,255,0.25), transparent 60%), radial-gradient(80% 40% at 30% 90%, rgba(255,255,255,0.18), transparent 60%); mix-blend-mode: screen; pointer-events: none; animation: shimmer 6s ease-in-out infinite; }
      @keyframes shimmer { 0% { opacity: 0.5; transform: translateY(0); } 50% { opacity: 0.85; transform: translateY(-6%); } 100% { opacity: 0.5; transform: translateY(0); } }
      .slider-vertical .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(148,163,184,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,0.10) 1px, transparent 1px); background-size: 100% 10%, 10% 100%; opacity: 0.35; pointer-events: none; }
      .slider-vertical .thumb { position: absolute; left: 50%; transform: translate(-50%, 50%); width: 64px; height: 64px; border-radius: 18px; background: radial-gradient(120% 100% at 30% 20%, #ffffffb5, #ffffff44 40%, #ffffff12 70%, #ffffff08); border: 1px solid rgba(255,255,255,0.28); backdrop-filter: blur(6px); box-shadow: 0 16px 32px rgba(0,0,0,0.45); touch-action: none; }
      .slider-vertical .track-overlay { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to top, black var(--fill,0%), transparent calc(var(--fill,0%) + 0.5px)); mask-image: linear-gradient(to top, black var(--fill,0%), transparent calc(var(--fill,0%) + 0.5px)); }
      .slider-vertical .hint { position: absolute; bottom: 8px; width: 100%; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
      .topbar-actions { display: inline-flex; gap: 8px; align-items: center; }
      .ghost { background: transparent; border: 1px solid rgba(148,163,184,0.3); }

      /* Buttons block - retro cassette skeuo */
      .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
      .btn-cassette { position: relative; padding: 16px; border-radius: 16px; color: var(--text); background: linear-gradient(180deg, #0e152b, #0b1023); border: 1px solid rgba(148,163,184,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -6px 10px rgba(0,0,0,0.35), 0 18px 36px rgba(0,0,0,0.35); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
      .btn-cassette::before { content: ""; position: absolute; inset: 0; border-radius: 16px; background: radial-gradient(120% 100% at 50% 0, rgba(255,255,255,0.06), transparent 40%); pointer-events: none; }
      .btn-cassette:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), inset 0 -2px 6px rgba(0,0,0,0.45), 0 10px 20px rgba(0,0,0,0.3); }
      .btn-cassette .label { display: block; text-align: center; font-weight: 600; letter-spacing: 0.4px; }
      .btn-cassette .led { position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 999px; background: radial-gradient(circle at 30% 30%, #22c55e, #15803d); box-shadow: 0 0 10px #22c55eaa; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="root"></div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState, useCallback } = React;

      function useWebSocket(url) {
        const [status, setStatus] = useState('disconnected');
        const [messages, setMessages] = useState([]);
        const wsRef = useRef(null);

        useEffect(() => {
          const ws = new WebSocket(url);
          wsRef.current = ws;
          setStatus('connecting');

          ws.addEventListener('open', () => {
            setStatus('connected');
            setMessages(m => [...m, { type: 'system', text: 'Connesso al server' }]);
          });

          ws.addEventListener('message', (evt) => {
            const data = evt.data;
            if (data === 'ping') {
              // Rispondi al keepalive del server
              ws.send('pong');
              return;
            }
            setMessages(m => [...m, { type: 'other', text: data }]);
          });

          ws.addEventListener('close', () => {
            setStatus('disconnected');
            setMessages(m => [...m, { type: 'system', text: 'Disconnesso' }]);
          });

          ws.addEventListener('error', () => {
            setMessages(m => [...m, { type: 'system', text: 'Errore WebSocket' }]);
          });

          return () => { ws.close(); };
        }, [url]);

        const send = (text) => {
          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(text);
            setMessages(m => [...m, { type: 'self', text }]);
          }
        };

        return { status, messages, send };
      }

      function SliderVertical({ title, value, onChange }) {
        const ref = useRef(null);

        const setFromEvent = useCallback((clientY) => {
          const el = ref.current;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          const rel = (rect.bottom - clientY) / rect.height; // bottom=0, top=1
          const clamped = Math.min(1, Math.max(0, rel));
          onChange(parseFloat(clamped.toFixed(3)));
        }, [onChange]);

        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const onPointerDown = (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); setFromEvent(e.clientY); };
          const onPointerMove = (e) => { if (e.buttons !== 1) return; setFromEvent(e.clientY); };
          el.addEventListener('pointerdown', onPointerDown);
          el.addEventListener('pointermove', onPointerMove);
          return () => {
            el.removeEventListener('pointerdown', onPointerDown);
            el.removeEventListener('pointermove', onPointerMove);
          };
        }, [setFromEvent]);

        const fill = `${(value * 100).toFixed(1)}%`;
        const thumbBottom = `calc(${fill} - 28px)`;

        return (
          <div className="slider-card">
            <div className="slider-title">
              <span>{title}</span>
              <span className="slider-value">{value.toFixed(3)}</span>
            </div>
            <div className="slider-vertical" ref={ref} style={{ '--fill': fill }}>
              <div className="liquid"></div>
              <div className="sheen"></div>
              <div className="grid"></div>
              <div className="thumb" style={{ bottom: thumbBottom }}></div>
              <div className="track-overlay"></div>
              <div className="hint">Trascina su/giù</div>
            </div>
          </div>
        );
      }

      function App() {
        const [host, setHost] = useState(window.location.hostname || 'localhost');
        const [devPort, setDevPort] = useState('443');
        const [path, setPath] = useState('');
        const [input, setInput] = useState('');
        const [showAdvanced, setShowAdvanced] = useState(false);
        const [slider1, setSlider1] = useState(0.0);

        const wsUrl = useMemo(() => {
          const isProd = window.location.protocol === 'https:' || window.location.port !== '3000';
          // Il server in dev usa ws://localhost:5001, in prod va in wss sullo stesso host
          if (!isProd) return `ws://${host}:${devPort}${path ? '/' + path : ''}`;
          return `wss://${host}${path ? '/' + path : ''}`;
        }, [host, devPort, path]);

        const { status, messages, send } = useWebSocket(wsUrl);

        // helper: send single-key JSON {name: value}
        const sendKV = useCallback((name, value) => {
          try { send(JSON.stringify({ [name]: value })); } catch {}
        }, [send]);

        // send slider1 as {"slider1": value}
        useEffect(() => { sendKV('slider1', slider1); }, [slider1, sendKV]);

        const dotClass = 'dot ' + (status === 'connected' ? 'connected' : 'disconnected');

        return (
          <div className="card">
            <header>
              <h1>Socket Controls</h1>
              <div className="topbar-actions">
                <div className="status">
                  <span className={dotClass}></span>
                  <span>{status}</span>
                </div>
                <button className="ghost" onClick={() => setShowAdvanced(s => !s)}>{showAdvanced ? 'Nascondi pannello' : 'Mostra pannello'}</button>
              </div>
            </header>

            {/* Sliders area - mobile first */}
            <div className="sliders">
              <SliderVertical title="slider1" value={slider1} onChange={setSlider1} />
            </div>

            <div className="buttons">
              <button className="btn-cassette" onClick={() => sendKV('button_value', 0)}>
                <span className="led"></span>
                <span className="label">Pulsante 1</span>
              </button>
              <button className="btn-cassette" onClick={() => sendKV('button_value', 1)}>
                <span className="led"></span>
                <span className="label">Pulsante 2</span>
              </button>
              <button className="btn-cassette" onClick={() => sendKV('button_value', 3)}>
                <span className="led"></span>
                <span className="label">Pulsante 3</span>
              </button>
            </div>

            {showAdvanced && (
              <div className="content">
                <div>
                  <div className="messages" id="messages">
                    {messages.map((m, i) => (
                      <div key={i} className={`msg ${m.type}`}>
                        {m.text}
                      </div>
                    ))}
                  </div>
                </div>

                <aside className="sidebar">
                  <div className="row">
                    <label>Host</label>
                    <input value={host} onChange={e => setHost(e.target.value)} />
                  </div>
                  <div className="row">
                    <label>Dev WS Port</label>
                    <input value={devPort} onChange={e => setDevPort(e.target.value)} />
                  </div>
                  <div className="row">
                    <label>WS Path (opzionale)</label>
                    <input placeholder="es. socket" value={path} onChange={e => setPath(e.target.value)} />
                  </div>
                  <div className="row">
                    <label>Azioni</label>
                    <div className="actions">
                      <button onClick={() => window.location.reload()}>Riconnetti</button>
                      <button className="primary" onClick={() => send('Hello from client')}>Invia Hello</button>
                    </div>
                  </div>
                </aside>
              </div>
            )}

            {showAdvanced && (
              <footer>
                <input
                  placeholder="Scrivi un messaggio e premi Invia"
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter' && input.trim()) { send(input.trim()); setInput(''); } }}
                />
                <button className="primary" onClick={() => { if (input.trim()) { send(input.trim()); setInput(''); } }}>Invia</button>
              </footer>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
  </html>
