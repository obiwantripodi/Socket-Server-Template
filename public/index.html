<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Control - React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#f5eedd; --panel:#efe6d3; --muted:#6b7280; --text:#1f2937; --accent:#e74e3c; --accent-dark:#c53030; --edge:#d7ceb9; --shadow:#00000026; }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(120% 80% at 50% -10%, #fffaf0, var(--bg)); color: var(--text); }
      .container { max-width: 900px; margin: 0 auto; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
      .card { background: linear-gradient(180deg, #fbf4e4, #efe6d5); border: 1px solid var(--edge); border-radius: 24px; box-shadow: inset 0 2px 0 #ffffffa6, inset 0 -6px 12px #0000001f, 0 24px 40px var(--shadow); overflow: hidden; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--edge); position: sticky; top: 0; background: linear-gradient(180deg, #fbf4e4cc, #efe6d5cc); z-index: 2; box-shadow: 0 6px 14px var(--shadow); }
      header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; text-transform: uppercase; color: #4b5563; text-shadow: 0 1px 0 #ffffffc0; }
      .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: #9ca3af; box-shadow: 0 0 4px #9ca3af; }
      .dot.connected { background: #16a34a; box-shadow: 0 0 8px #16a34a99; }
      .dot.disconnected { background: #b91c1c; box-shadow: 0 0 8px #b91c1c99; }
      .content { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
      @media (max-width: 800px) { .content { grid-template-columns: 1fr; } }
      .messages { background: linear-gradient(180deg, #f6efde, #efe6d5); border: 1px solid var(--edge); border-radius: 14px; min-height: 160px; max-height: 40vh; overflow: auto; padding: 12px; box-shadow: inset 0 2px 0 #ffffffa6, inset 0 -4px 8px #0000001a; display: flex; flex-direction: column-reverse; }
      .msg { padding: 10px 12px; margin: 8px 0; border-radius: 10px; line-height: 1.35; border: 1px solid var(--edge); background: #fffdf7; box-shadow: inset 0 1px 0 #ffffffbf, 0 2px 4px #00000012; }
      .msg.self { background: #fff1f0; }
      .msg.other { background: #eef6ff; }
      .msg.system { background: #f3f4f6; color: var(--muted); font-size: 13px; }
      .sidebar { background: rgba(2,6,23,0.35); border: 1px solid rgba(148,163,184,0.12); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; }
      .row { display: grid; gap: 8px; }
      label { font-size: 12px; color: var(--muted); }
      input, button, select { font: inherit; }
      input, select { width: 100%; padding: 10px 12px; background: #0b1220; color: var(--text); border: 1px solid rgba(148,163,184,0.2); border-radius: 8px; outline: none; }
      input:focus, select:focus { border-color: rgba(34,197,94,0.7); box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
      .actions { display: flex; gap: 8px; }
      button { padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.25); background: #0b1220; color: var(--text); cursor: pointer; transition: transform 0.05s ease; }
      button.primary { background: linear-gradient(135deg, #22c55e, #16a34a); border: none; }
      button:active { transform: translateY(1px); }
      footer { padding: 12px 16px; border-top: 1px solid rgba(148,163,184,0.12); display: flex; gap: 8px; }
      footer input { flex: 1; }

      /* Sliders layout */
      .sliders { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; }
      @media (max-width: 480px) { .sliders { grid-template-columns: 1fr; gap: 12px; } }
      .slider-card { position: relative; background: linear-gradient(180deg, #fbf4e4, #efe6d5); border: 1px solid var(--edge); border-radius: 18px; padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; box-shadow: inset 0 2px 0 #ffffffa6, inset 0 -6px 12px #0000001f; }
      .slider-title { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #374151; }
      .slider-value { font-weight: 700; color: #111827; }
      .slider-vertical { position: relative; height: 52vh; min-height: 360px; border-radius: 18px; background: linear-gradient(180deg, #f3ebd8, #ece2cd); border: 1px solid var(--edge); overflow: hidden; touch-action: none; box-shadow: inset 0 -10px 20px #0000001a, inset 0 10px 20px #ffffff59; }
      /* skeuomorphic cassette-style track */
      .slider-vertical::before { content: ""; position: absolute; inset: 10px; border-radius: 14px; background: linear-gradient(180deg, #fff7e9, #efe6d5); box-shadow: inset 0 2px 3px #ffffffa6, inset 0 -8px 16px #00000029, 0 10px 20px #00000024; }
      .slider-vertical .ticks { position: absolute; left: 50%; top: 12px; bottom: 12px; width: 60%; transform: translateX(-50%); opacity: 0.35; background-image: repeating-linear-gradient(to top, #d8cfba 0 1px, transparent 1px 9%); pointer-events: none; }
      .slider-vertical .fill { position: absolute; left: 10px; right: 10px; bottom: 10px; border-radius: 12px; height: var(--fill, 0%); background: linear-gradient(180deg, #e3dac6, #d8cfbb); box-shadow: inset 0 1px 2px #ffffff80, inset 0 -8px 14px #00000029; border: 1px solid var(--edge); }
      .slider-vertical .thumb { position: absolute; left: 50%; transform: translate(-50%, 50%); width: 78px; height: 28px; border-radius: 10px; background: linear-gradient(180deg, #fffaf0, #e9dfca); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 #ffffffbf, inset 0 -2px 6px #00000033, 0 6px 14px #00000024; touch-action: none; }
      .slider-vertical .hint { position: absolute; bottom: 8px; width: 100%; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
      .topbar-actions { display: inline-flex; gap: 10px; align-items: center; }
      .hamburger { width: 38px; height: 34px; border-radius: 10px; background: linear-gradient(180deg, #fff8ea, #eee4cf); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 #ffffffbf, inset 0 -3px 6px #00000024; position: relative; cursor: pointer; }
      .hamburger span { position: absolute; left: 8px; right: 8px; height: 2px; background: #6b7280; border-radius: 2px; box-shadow: 0 1px 0 #ffffff80; }
      .hamburger span:nth-child(1){ top: 9px; }
      .hamburger span:nth-child(2){ top: 16px; }
      .hamburger span:nth-child(3){ top: 23px; }

      /* Buttons block - retro cassette skeuo */
      .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; }
      .btn-cassette { position: relative; padding: 16px 12px; border-radius: 12px; color: #374151; background: linear-gradient(180deg, #fff8ea, #eee4cf); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 #ffffffbf, inset 0 -4px 8px #00000024, 0 14px 24px #00000024; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 0.05s ease, box-shadow 0.15s ease; }
      .btn-cassette::before { content: ""; position: absolute; inset: 0; border-radius: 12px; background: radial-gradient(160% 120% at 50% 0, #ffffff70, transparent 40%); pointer-events: none; }
      .btn-cassette.active { background: linear-gradient(180deg, #f6edda, #e7dcc4); box-shadow: inset 0 1px 0 #ffffffa6, inset 0 3px 8px #00000033, 0 8px 16px #0000001f; }
      .btn-cassette:active { transform: translateY(2px); }
      .btn-cassette .label { display: none; }
      
      /* Drawer console */
      .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 350px; max-width: 86vw; background: linear-gradient(180deg, #fbf4e4, #efe6d5); border-left: 1px solid var(--edge); box-shadow: -20px 0 40px #00000026; transform: translateX(100%); transition: transform 220ms ease; z-index: 4; display: grid; grid-template-rows: auto 1fr; }
      .drawer.open { transform: translateX(0); }
      .drawer .scroll { padding: 12px; overflow: auto; }
      .drawer .messages { max-height: unset; height: 100%; }
      
      /* Slider tactile */
      .slider-vertical.active .thumb { box-shadow: inset 0 1px 0 #ffffffbf, inset 0 -2px 6px #00000040, 0 8px 18px #00000030; }
      .btn-cassette .led { position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 999px; background: radial-gradient(circle at 30% 30%, #b91c1c, #7f1d1d); box-shadow: 0 0 8px #b91c1c88; opacity: 0.9; transition: background 0.2s ease, box-shadow 0.2s ease; }
      .btn-cassette.active .led { background: radial-gradient(circle at 30% 30%, #16a34a, #166534); box-shadow: 0 0 10px #16a34aaa; }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="root"></div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState, useCallback } = React;

      // Haptics (best-effort): usa Vibration API se disponibile; throttle per non spammare
      const useHaptics = () => {
        const lastRef = useRef(0);
        const vibrate = (duration = 10) => {
          try { if (navigator?.vibrate) navigator.vibrate(duration); } catch {}
        };
        const light = useCallback(() => {
          const now = Date.now();
          if (now - lastRef.current < 35) return; // throttle ~30Hz
          lastRef.current = now;
          vibrate(8);
        }, []);
        const medium = useCallback(() => vibrate(15), []);
        return { light, medium };
      };

      function useWebSocket(url) {
        const [status, setStatus] = useState('disconnected');
        const [messages, setMessages] = useState([]);
        const wsRef = useRef(null);

        useEffect(() => {
          const ws = new WebSocket(url);
          wsRef.current = ws;
          setStatus('connecting');

          ws.addEventListener('open', () => {
            setStatus('connected');
            setMessages(m => [...m, { type: 'system', text: 'Connesso al server' }]);
          });

          ws.addEventListener('message', (evt) => {
            const data = evt.data;
            if (data === 'ping') {
              // Rispondi al keepalive del server
              ws.send('pong');
              return;
            }
            setMessages(m => [...m, { type: 'other', text: data }]);
          });

          ws.addEventListener('close', () => {
            setStatus('disconnected');
            setMessages(m => [...m, { type: 'system', text: 'Disconnesso' }]);
          });

          ws.addEventListener('error', () => {
            setMessages(m => [...m, { type: 'system', text: 'Errore WebSocket' }]);
          });

          return () => { ws.close(); };
        }, [url]);

        const send = (text) => {
          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(text);
            setMessages(m => [...m, { type: 'self', text }]);
          }
        };

        return { status, messages, send };
      }

      function SliderVertical({ title, value, onChange, onInteractStart, haptic }) {
        const ref = useRef(null);

        const setFromEvent = useCallback((clientY) => {
          const el = ref.current;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          const rel = (rect.bottom - clientY) / rect.height; // bottom=0, top=1
          const clamped = Math.min(1, Math.max(0, rel));
          onChange(parseFloat(clamped.toFixed(3)));
        }, [onChange]);

        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const onPointerDown = (e) => { e.preventDefault(); onInteractStart?.(); el.classList.add('active'); el.setPointerCapture?.(e.pointerId); setFromEvent(e.clientY); haptic?.medium?.(); };
          const onPointerMove = (e) => { if (e.buttons !== 1) { el.classList.remove('active'); return; } setFromEvent(e.clientY); haptic?.light?.(); };
          const onPointerUp = () => { el.classList.remove('active'); };
          el.addEventListener('pointerdown', onPointerDown);
          el.addEventListener('pointermove', onPointerMove);
          el.addEventListener('pointerup', onPointerUp);
          return () => {
            el.removeEventListener('pointerdown', onPointerDown);
            el.removeEventListener('pointermove', onPointerMove);
            el.removeEventListener('pointerup', onPointerUp);
          };
        }, [setFromEvent]);

        const fill = `${(value * 100).toFixed(1)}%`;
        const thumbBottom = `calc(${fill} - 28px)`;

        return (
          <div className="slider-card">
            <div className="slider-title">
              <span>{title}</span>
              <span className="slider-value">{value.toFixed(3)}</span>
            </div>
            <div className="slider-vertical" ref={ref} style={{ '--fill': fill }}>
              <div className="ticks"></div>
              <div className="fill"></div>
              <div className="thumb" style={{ bottom: thumbBottom }}></div>
              <div className="hint">Trascina su/giù</div>
            </div>
          </div>
        );
      }

      function App() {
        const haptics = useHaptics();
        const [host, setHost] = useState(window.location.hostname || 'localhost');
        const [devPort, setDevPort] = useState('443');
        const [path, setPath] = useState('');
        const [input, setInput] = useState('');
        const [showAdvanced, setShowAdvanced] = useState(false);
        const [slider1, setSlider1] = useState(0.0);
        const [button, setButton] = useState(null); // 0,1,2,3 or null
        const [sliderInteracted, setSliderInteracted] = useState(false);
        const prevSliderRef = useRef(slider1);

        const wsUrl = useMemo(() => {
          const isProd = window.location.protocol === 'https:' || window.location.port !== '3000';
          // Il server in dev usa ws://localhost:5001, in prod va in wss sullo stesso host
          if (!isProd) return `ws://${host}:${devPort}${path ? '/' + path : ''}`;
          return `wss://${host}${path ? '/' + path : ''}`;
        }, [host, devPort, path]);

        const { status, messages, send } = useWebSocket(wsUrl);

        // helper: send combined payload {slider1, button}
        const sendAll = useCallback((sVal, bVal) => {
          try { send(JSON.stringify({ slider1: sVal, button: bVal })); } catch {}
        }, [send]);

        // send slider1 ONLY on actual user-led value changes (not on mount), combined with current button
        useEffect(() => {
          if (!sliderInteracted) return;
          const prev = prevSliderRef.current;
          if (Math.abs(prev - slider1) >= 0.001) {
            sendAll(slider1, button);
            prevSliderRef.current = slider1;
          }
        }, [slider1, sliderInteracted, button, sendAll]);

        const dotClass = 'dot ' + (status === 'connected' ? 'connected' : 'disconnected');

        return (
          <div className="card">
            <header>
              <h1>Scenario Control</h1>
              <div className="topbar-actions">
                <div className="status">
                  <span className={dotClass}></span>
                  <span>{status}</span>
                </div>
                <button aria-label="Apri console" className="hamburger" onClick={() => setShowAdvanced(s => !s)}>
                  <span></span><span></span><span></span>
                </button>
              </div>
            </header>

            {/* Sliders area - mobile first */}
            <div className="sliders">
              <SliderVertical title="slider1" value={slider1} onChange={setSlider1} onInteractStart={() => setSliderInteracted(true)} haptic={haptics} />
            </div>

            <div className="buttons">
              <button aria-label="Button 0" className={`btn-cassette ${button===0?'active':''}`} onClick={() => { setButton(0); sendAll(slider1, 0); haptics.medium(); }}>
                <span className="led"></span>
                <span className="label"></span>
              </button>
              <button aria-label="Button 1" className={`btn-cassette ${button===1?'active':''}`} onClick={() => { setButton(1); sendAll(slider1, 1); haptics.medium(); }}>
                <span className="led"></span>
                <span className="label"></span>
              </button>
              <button aria-label="Button 2" className={`btn-cassette ${button===2?'active':''}`} onClick={() => { setButton(2); sendAll(slider1, 2); haptics.medium(); }}>
                <span className="led"></span>
                <span className="label"></span>
              </button>
              <button aria-label="Custom Text" className={`btn-cassette ${button===3?'active':''}`} onClick={() => { setButton(3); sendAll(slider1, 3); haptics.medium(); }}>
                <span className="led"></span>
                <span className="label"></span>
              </button>
            </div>
            <div className={`drawer ${showAdvanced ? 'open' : ''}`}>
              <header>
                <h1>Console</h1>
              </header>
              <div className="scroll">
                <div className="messages" id="messages">
                  {[...messages].slice(-200).reverse().map((m, i) => (
                    <div key={i} className={`msg ${m.type}`}>
                      {m.text}
                    </div>
                  ))}
                </div>
                <div className="row" style={{ marginTop: 12 }}>
                  <label>Host</label>
                  <input value={host} onChange={e => setHost(e.target.value)} />
                </div>
                <div className="row">
                  <label>Dev WS Port</label>
                  <input value={devPort} onChange={e => setDevPort(e.target.value)} />
                </div>
                <div className="row">
                  <label>WS Path (opzionale)</label>
                  <input placeholder="es. socket" value={path} onChange={e => setPath(e.target.value)} />
                </div>
                <div className="row">
                  <label>Invia testo</label>
                  <div className="actions">
                    <input style={{ flex: 1 }} placeholder="Scrivi e invia" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && input.trim()) { send(input.trim()); setInput(''); } }} />
                    <button className="primary" onClick={() => { if (input.trim()) { send(input.trim()); setInput(''); } }}>Invia</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
  </html>
